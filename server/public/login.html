<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | BubbleWash</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/workspace.css"><script src="/auth/login.js" defer></script></head><body class="login-page"><main class="modal login-card"><span class="eyebrow">BUBBLEWASH WORKSPACE</span><h1>Welcome back</h1><p class="dialog-description">Sign in to access your shared laundry records.</p><form id="loginForm" novalidate><div class="form-grid"><label class="form-field full-width">Username<input id="username" autocomplete="username" required maxlength="30"></label><label class="form-field full-width">Password<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label></div><p id="loginError" class="form-error hidden" role="alert"></p><div class="modal-actions"><button id="signIn" class="primary-button" type="submit">Sign in</button></div></form></main></body></html>
